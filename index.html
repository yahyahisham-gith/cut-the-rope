<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Rope - Selector</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 50px; }
        .card-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .card { 
            background: #2d2d2d; border: 1px solid #444; padding: 20px; border-radius: 10px; width: 250px;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-50px); border-color: #4CAF50; }
        button { 
            background: #4CAF50; color: white; border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .warning { color: #ff9800; font-size: 0.8em; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Select Version</h1>
    <div class="card-container">
        <div class="card">
            <h3>Mirror 1</h3>
            <p>CrazyGames Version</p>
            <button onclick="window.open('https://cut-the-rope-ebx.game-files.crazygames.com/cut-the-rope-ebx/2/index.html', '_blank')">Open in New Tab</button>
            <p class="warning">CORS prevents Iframe use</p>
        </div>

        <div class="card">
            <h3>Mirror 2</h3>
            <p>Famobi Wrapper</p>
            <button onclick="loadIframe('https://play.famobi.com/wrapper/cut-the-rope/A1000-10')">Load Here</button>
        </div>
    </div>

    <div id="game-area" style="margin-top: 30px; display: none;">
        <iframe id="game-frame" width="800" height="600" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <script>
        function loadIframe(url) {
            const area = document.getElementById('game-area');
            const frame = document.getElementById('game-frame');
            area.style.display = 'block';
            frame.src = url;
            area.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
