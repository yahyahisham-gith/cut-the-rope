<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Rope - Source Selector</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #659729; /* Om Nom Green */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #controls {
            background-color: var(--panel-color);
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #444;
            flex-wrap: wrap;
            height: auto;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #444;
            color: white;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        button.active {
            background-color: var(--accent-color);
        }

        /* Styling for the redirect buttons */
        .external-btn {
            background-color: #d35400;
        }
        .external-btn:hover {
            background-color: #e67e22;
        }

        #game-container {
            width: 100vw;
            height: calc(100vh - 75px); 
            position: relative;
            background: #000;
            box-sizing: border-box;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .status {
            font-size: 0.85em;
            color: #888;
            margin-left: 15px;
        }

        .fs-btn { background-color: #2196F3; }
        .fs-btn:hover { background-color: #1e88e5; }
    </style>
</head>
<body>

    <div id="controls">
        <button class="external-btn" onclick="handleNavigation(this, 'https://ctrhome.github.io/CutTheRope-FirefoxOS/', true)">FirefoxOS Version ↗</button>
        <button class="external-btn" onclick="handleNavigation(this, 'https://yell0wsuit.page/assets/games/CutTheRope/index.html', true)">Mobile Version ↗</button>
        
        <button onclick="handleNavigation(this, 'https://yell0wsuit.github.io/cuttherope-h5dx/', false)">PC (H5DX)</button>
        <button onclick="handleNavigation(this, 'https://play.famobi.com/wrapper/cut-the-rope/A1000-10', false)">Famobi Wrapper</button>
        <button onclick="handleNavigation(this, 'https://play.famobi.com/cut-the-rope', false)">Famobi Direct</button>
        <button onclick="handleNavigation(this, 'https://cut-the-rope-ebx.game-files.crazygames.com/cut-the-rope-ebx/2/index.html', false)">CrazyGames</button>
        
        <button onclick="toggleFullscreen()" class="fs-btn">Fullscreen</button>
        <span class="status" id="current-url">Ready</span>
    </div>

    <div id="game-container">
        <iframe id="game-frame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        const frame = document.getElementById('game-frame');
        const statusText = document.getElementById('current-url');

        function handleNavigation(btn, url, isExternal) {
            // Manage button active states cleanly
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const secureUrl = url.replace("http://", "https://");

            if (isExternal) {
                // Clear the iframe so a previous game session isn't running or wasting system resources
                frame.src = "about:blank";
                statusText.textContent = "Redirected to: " + secureUrl;
                
                // Safe execution context for modern browser pop-up handlers
                const newWindow = window.open(secureUrl, '_blank');
                if (newWindow) {
                    newWindow.focus();
                } else {
                    // Fail-safe if the browser environment is locked down tight
                    alert("Pop-up blocker intercepted the redirect. Please allow pop-ups for this site or click the link manually.");
                }
            } else {
                // Embed normally into the full-size layout container
                frame.src = secureUrl;
                statusText.textContent = "Source: " + secureUrl;
            }
        }

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error("Fullscreen error:", err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Set PC (H5DX) as the auto-loading base since the others are now external redirects
        window.addEventListener('DOMContentLoaded', () => {
            const defaultBtn = document.querySelector('button[onclick*="h5dx"]');
            if (defaultBtn) defaultBtn.click();
        });
    </script>
</body>
</html>
