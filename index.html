<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Rope - Ultimate Selector</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #659729; /* Om Nom Green */
            --blue-accent: #2196F3;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #controls {
            background-color: var(--panel-color);
            padding: 12px;
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #444;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #444;
            color: white;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #555;
            transform: translateY(-1px);
        }

        button.active {
            background-color: var(--accent-color);
        }

        .pop-btn {
            background-color: #8e44ad; /* Purple for external links */
        }

        #game-container {
            flex-grow: 1;
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #error-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .fs-btn { background-color: var(--blue-accent); }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="loadSource(this, 'https://yell0wsuit.github.io/cuttherope-h5dx/')">PC (H5DX)</button>
        <button onclick="loadSource(this, 'https://play.famobi.com/wrapper/cut-the-rope/A1000-10')">Famobi Wrapper</button>
        <button onclick="loadSource(this, 'https://play.famobi.com/cut-the-rope')">Famobi Direct</button>
        
        <button class="pop-btn" onclick="openExternal('https://yell0wsuit.page/assets/games/CutTheRope/index.html')">Mobile Version ↗</button>
        <button class="pop-btn" onclick="openExternal('https://cut-the-rope-ebx.game-files.crazygames.com/cut-the-rope-ebx/2/index.html')">CrazyGames ↗</button>
        
        <button onclick="toggleFullscreen()" class="fs-btn">Fullscreen</button>
    </div>

    <div id="game-container">
        <iframe id="game-frame" src="about:blank" allowfullscreen></iframe>
        
        <div id="error-overlay">
            <h2>Source Blocked Embedding</h2>
            <p>This version refuses to run inside a frame for security reasons.</p>
            <button id="retry-btn" class="pop-btn" style="padding: 15px 30px; font-size: 16px;">Open in New Tab Instead</button>
        </div>
    </div>

    <script>
        const frame = document.getElementById('game-frame');
        const overlay = document.getElementById('error-overlay');
        const retryBtn = document.getElementById('retry-btn');

        function loadSource(btn, url) {
            overlay.style.display = 'none';
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            frame.src = url;
        }

        function openExternal(url) {
            window.open(url, '_blank');
        }

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // Detect if the yell0wsuit.page link was clicked and show the helper
        function handleMobileRefusal(url) {
            overlay.style.display = 'flex';
            retryBtn.onclick = () => window.open(url, '_blank');
        }
    </script>
</body>
</html>
