<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Rope - Ultimate Selector</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #1f1f1f; padding: 15px; display: flex; gap: 15px; justify-content: center; border-bottom: 2px solid #333; }
        button { 
            padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; 
            font-weight: bold; background: #3d3d3d; color: white; transition: 0.3s;
        }
        button:hover { background: #505050; transform: scale(1.05); }
        button.active { background: #659729; } /* Om Nom Green */
        #container { flex-grow: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .fullscreen-btn { background: #2196F3; position: absolute; bottom: 20px; right: 20px; }
    </style>
</head>
<body>

    <div id="header">
        <button onclick="loadGame(this, 'https://yell0wsuit.github.io/cuttherope-h5dx/')">PC (H5DX Version)</button>
        <button onclick="loadGame(this, 'https://yell0wsuit.page/assets/games/CutTheRope/index.html')">Mobile (Original Assets)</button>
    </div>

    <div id="container">
        <iframe id="game-frame" src="about:blank"></iframe>
        <button class="fullscreen-btn" onclick="goFullscreen()">Fullscreen</button>
    </div>

    <script>
        function loadGame(btn, url) {
            // Update active state
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const frame = document.getElementById('game-frame');
            
            // Bypass logic: if it's the .page link, we might need to open in a new tab 
            // if the iframe is blocked. Testing direct load first.
            frame.src = url;
        }

        function goFullscreen() {
            const elem = document.getElementById("container");
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        }
    </script>
</body>
</html>
