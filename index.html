<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Rope - Source Selector</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #659729; /* Om Nom Green */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #controls {
            background-color: var(--panel-color);
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #444;
            flex-wrap: wrap;
            height: auto;
            box-sizing: border-box;
        }

        /* Unified styling for real buttons and link buttons */
        button, .link-button {
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #444;
            color: white;
            font-weight: bold;
            font-size: 13.333px; /* Matches default button size */
            text-decoration: none; /* Removes underline from links */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-sizing: border-box;
            height: 38px; /* Forces uniform height */
        }

        button:hover, .link-button:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        button.active, .link-button.active {
            background-color: var(--accent-color);
        }

        /* Styling for the unblockable redirect links */
        .external-btn {
            background-color: #d35400;
        }
        .external-btn:hover {
            background-color: #e67e22;
        }

        #game-container {
            width: 100vw;
            height: calc(100vh - 75px); 
            position: relative;
            background: #000;
            box-sizing: border-box;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .status {
            font-size: 0.85em;
            color: #888;
            margin-left: 15px;
        }

        .fs-btn { background-color: #2196F3; }
        .fs-btn:hover { background-color: #1e88e5; }
    </style>
</head>
<body>

    <div id="controls">
        <button id="default-game" onclick="handleNavigation(this, 'https://yell0wsuit.github.io/cuttherope-h5dx/')">PC (H5DX)</button>
        <button onclick="handleNavigation(this, 'https://play.famobi.com/wrapper/cut-the-rope/A1000-10')">Famobi Wrapper</button>
        <button onclick="handleNavigation(this, 'https://play.famobi.com/cut-the-rope')">Famobi Direct</button>
        <button onclick="handleNavigation(this, 'https://cut-the-rope-ebx.game-files.crazygames.com/cut-the-rope-ebx/2/index.html')">CrazyGames</button>
        
        <a href="https://ctrhome.github.io/CutTheRope-FirefoxOS/" target="_blank" class="link-button external-btn" onclick="activateLink(this)">FirefoxOS Version ↗</a>
        <a href="https://yell0wsuit.page/assets/games/CutTheRope/index.html" target="_blank" class="link-button external-btn" onclick="activateLink(this)">Mobile Version ↗</a>
        
        <button onclick="toggleFullscreen()" class="fs-btn">Fullscreen</button>
        <span class="status" id="current-url">Ready</span>
    </div>

    <div id="game-container">
        <iframe id="game-frame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        const frame = document.getElementById('game-frame');
        const statusText = document.getElementById('current-url');

        // Handles regular embedded iframe options
        function handleNavigation(btn, url) {
            clearActiveStates();
            btn.classList.add('active');

            const secureUrl = url.replace("http://", "https://");
            frame.src = secureUrl;
            statusText.textContent = "Source: " + secureUrl;
        }

        // Handles UI active switching when clicking the unblockable link elements
        function activateLink(element) {
            clearActiveStates();
            element.classList.add('active');
            statusText.textContent = "Opened in external tab: " + element.href;
        }

        function clearActiveStates() {
            document.querySelectorAll('button, .link-button').forEach(el => el.classList.remove('active'));
        }

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error("Fullscreen error:", err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Auto-load the internal H5DX build on page setup
        window.addEventListener('DOMContentLoaded', () => {
            const defaultBtn = document.getElementById('default-game');
            if (defaultBtn) {
                defaultBtn.click();
            }
        });
    </script>
</body>
</html>
