<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Rope - Source Selector</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #659729; /* Om Nom Green */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #controls {
            background-color: var(--panel-color);
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #444;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #444;
            color: white;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        button.active {
            background-color: var(--accent-color);
        }

        /* Styling for the ones that refuse to connect */
        .external-btn {
            background-color: #d35400;
        }

        #game-container {
            flex-grow: 1;
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .status {
            font-size: 0.85em;
            color: #888;
            margin-left: 15px;
        }

        .fs-btn { background-color: #2196F3; }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="loadSource(this, 'https://yell0wsuit.github.io/cuttherope-h5dx/')">PC (H5DX)</button>
        <button onclick="loadSource(this, 'https://play.famobi.com/wrapper/cut-the-rope/A1000-10')">Famobi Wrapper</button>
        <button onclick="loadSource(this, 'https://play.famobi.com/cut-the-rope')">Famobi Direct</button>
        <button onclick="loadSource(this, 'https://cut-the-rope-ebx.game-files.crazygames.com/cut-the-rope-ebx/2/index.html')">CrazyGames</button>
        
        <button class="external-btn" onclick="window.open('https://yell0wsuit.page/assets/games/CutTheRope/index.html', '_blank')">Mobile Version ↗</button>
        
        <button onclick="toggleFullscreen()" class="fs-btn">Fullscreen</button>
        <span class="status" id="current-url">Ready</span>
    </div>

    <div id="game-container">
        <iframe id="game-frame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        const frame = document.getElementById('game-frame');
        const statusText = document.getElementById('current-url');

        function loadSource(btn, url) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            frame.src = url;
            statusText.textContent = "Source: " + url;
        }

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error("Fullscreen error:", err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
