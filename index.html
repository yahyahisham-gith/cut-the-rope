<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Rope - Source Selector</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #659729; /* Om Nom Green */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #controls {
            background-color: var(--panel-color);
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #444;
            flex-wrap: wrap;
            height: auto;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #444;
            color: white;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        button.active {
            background-color: var(--accent-color);
        }

        .external-btn {
            background-color: #d35400;
        }
        .external-btn:hover {
            background-color: #e67e22;
        }

        /* FIX: Use viewport height minus the header space to guarantee it fills the screen */
        #game-container {
            width: 100vw;
            height: calc(100vh - 75px); 
            position: relative;
            background: #000;
            box-sizing: border-box;
        }

        /* FIX: Absolute positioning forces the iframe to expand completely inside the container */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .status {
            font-size: 0.85em;
            color: #888;
            margin-left: 15px;
        }

        .fs-btn { background-color: #2196F3; }
        .fs-btn:hover { background-color: #1e88e5; }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="loadSource(this, 'https://ctrhome.github.io/CutTheRope-FirefoxOS/')">FirefoxOS Version</button>
        <button onclick="loadSource(this, 'https://yell0wsuit.github.io/cuttherope-h5dx/')">PC (H5DX)</button>
        <button onclick="loadSource(this, 'https://play.famobi.com/wrapper/cut-the-rope/A1000-10')">Famobi Wrapper</button>
        <button onclick="loadSource(this, 'https://play.famobi.com/cut-the-rope')">Famobi Direct</button>
        <button onclick="loadSource(this, 'https://cut-the-rope-ebx.game-files.crazygames.com/cut-the-rope-ebx/2/index.html')">CrazyGames</button>
        
        <button class="external-btn" onclick="window.open('https://yell0wsuit.page/assets/games/CutTheRope/index.html', '_blank')">Mobile Version ↗</button>
        
        <button onclick="toggleFullscreen()" class="fs-btn">Fullscreen</button>
        <span class="status" id="current-url">Ready</span>
    </div>

    <div id="game-container">
        <iframe id="game-frame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        const frame = document.getElementById('game-frame');
        const statusText = document.getElementById('current-url');

        function loadSource(btn, url) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const secureUrl = url.replace("http://", "https://");
            frame.src = secureUrl;
            statusText.textContent = "Source: " + secureUrl;
        }

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error("Fullscreen error:", err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const firstBtn = document.querySelector('button');
            if (firstBtn) firstBtn.click();
        });
    </script>
</body>
</html>
